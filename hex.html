<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>HEX & HEXA Visualizer</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#171717;background:#f5f5f5}
*{box-sizing:border-box} body{margin:0;min-height:100vh}
header{padding:18px 5vw;background:#111;color:white;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
header strong{font-size:20px} nav a{color:#ddd;text-decoration:none;margin-right:14px}nav a:hover{color:white}
main{width:min(1100px,92vw);margin:32px auto 60px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{background:white;border-radius:18px;padding:24px;box-shadow:0 10px 30px #00000012}
.preview{height:310px;border-radius:18px;border:1px solid #0002;display:grid;place-items:center;transition:.15s}
.preview span{background:#fffD;padding:10px 14px;border-radius:10px;font-weight:700}
.control{margin:20px 0}.control label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
input[type=range]{width:100%;height:8px}.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#111;color:#fff;padding:14px;border-radius:12px;margin:9px 0;overflow:auto}
.breakdown{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:12px 16px;background:#eee;border-radius:12px;font-family:monospace;font-weight:700}
h1{font-size:clamp(30px,5vw,52px);margin-bottom:8px}p.lead{font-size:18px;color:#555;margin-top:0}
table{width:100%;border-collapse:collapse}td,th{padding:11px;border-bottom:1px solid #ddd;text-align:left}
button{border:0;background:#111;color:white;padding:9px 13px;border-radius:9px;cursor:pointer}
.row{display:flex;gap:10px;align-items:center}.row .code{flex:1}
@media(max-width:760px){.grid{grid-template-columns:1fr}.preview{height:230px}}
</style></head><body><header><strong>CSS Color Lab</strong><nav>
<a href="index.html">Home</a><a href="rgb.html">RGB / RGBA</a><a href="hex.html">HEX / HEXA</a><a href="hsl.html">HSL / HSLA</a><a href="compare.html">Compare</a>
</nav></header><main>
<h1>HEX & HEXA Visualizer</h1><p class="lead">HEX uses base 16: 0–9 and A–F. Two digits represent each RGB channel.</p>
<div class="grid"><div class="card">
<div class="control"><label>Red <b id="rv"></b></label><input id="r" type="range" min="0" max="255" value="255"></div>
<div class="control"><label>Green <b id="gv"></b></label><input id="g" type="range" min="0" max="255" value="87"></div>
<div class="control"><label>Blue <b id="bv"></b></label><input id="b" type="range" min="0" max="255" value="51"></div>
<div class="control"><label>Alpha <b id="av"></b></label><input id="a" type="range" min="0" max="255" value="255"></div>
</div><div class="card"><div id="preview" class="preview"><span id="full"></span></div>
<h3>Breakdown</h3><div class="breakdown"><div class="pill">#</div><div class="pill" id="rh"></div><div class="pill" id="gh"></div><div class="pill" id="bh"></div><div class="pill" id="ah"></div></div>
<table><tr><th>Channel</th><th>HEX</th><th>Calculation</th><th>Decimal</th></tr>
<tr><td>Red</td><td id="rt"></td><td id="rc"></td><td id="rd"></td></tr><tr><td>Green</td><td id="gt"></td><td id="gc"></td><td id="gd"></td></tr>
<tr><td>Blue</td><td id="bt"></td><td id="bc"></td><td id="bd"></td></tr><tr><td>Alpha</td><td id="at"></td><td id="ac"></td><td id="ad"></td></tr></table>
</div></div></main><script>
const $=id=>document.getElementById(id), digits='0123456789ABCDEF';
function hx(n){return n.toString(16).padStart(2,'0').toUpperCase()}
function calc(n){let h=hx(n),x=digits.indexOf(h[0]),y=digits.indexOf(h[1]);return `${x} × 16 + ${y} = ${n}`}
function update(){let vals={r:+r.value,g:+g.value,b:+b.value,a:+a.value};for(let k of ['r','g','b','a']){$(k+'v').textContent=vals[k];$(k+'h').textContent=hx(vals[k]);$(k+'t').textContent=hx(vals[k]);$(k+'c').textContent=calc(vals[k]);$(k+'d').textContent=vals[k]}
let code='#'+hx(vals.r)+hx(vals.g)+hx(vals.b)+hx(vals.a);full.textContent=code;preview.style.background=code}
document.querySelectorAll('input').forEach(x=>x.oninput=update);update();
</script></body></html>
